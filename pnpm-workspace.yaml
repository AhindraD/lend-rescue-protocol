packages:
  - "apps/*"
  - "apps/adapters/*"
  - "tests/*"

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "bigint-buffer"
  - "bufferutil"
  - "esbuild"
  - "ffmpeg-static"
  - "sharp"
  - "utf-8-validate"

allowBuilds:
  '@tailwindcss/oxide': true
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  ffmpeg-static: true
  sharp: true
  utf-8-validate: true
