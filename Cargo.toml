[workspace]
resolver = "2"
members = [
    "programs/lend_rescue",
    "crates/domain-types",
    "crates/risk-engine",
    "crates/recovery-engine",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["LendRescue Contributors"]
repository = "https://github.com/AhindraD/lend-rescue-protocol"
homepage = "https://github.com/AhindraD/lend-rescue-protocol"
readme = "README.md"

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
thiserror = "=2.0.21"
domain-types = { path = "crates/domain-types" }
risk-engine = { path = "crates/risk-engine" }
recovery-engine = { path = "crates/recovery-engine" }

axum = "=0.8.9"
tokio = { version = "=1.51.4", default-features = false }
tower = "=0.5.2"
tower-http = "=0.7.1"
sqlx = { version = "=0.9.0", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false }
utoipa = "=6.0.0"
uuid = { version = "=1.29.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false }

[profile.release]
overflow-checks = true
